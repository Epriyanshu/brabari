<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My college ID</title>
    <!-- add logo in title baar -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card-container">

        <div class="id-card">
            <header class="card-header">
                <img src="img/clg logo.jpeg" alt="College-logo" class="logo">
                <img src="img/header.jpg" alt="College name " id="college-name">
                <hr>
                <!-- <p id="na"><strong>GLI Agra </strong></p> -->

            </header>
            <div class="photo-wrap">
                <img src="img/photo.jpg" alt="Profile-photo" id="pp">
            </div>
            <main id="card-body">
                <div class="name-section">
                    <h2 class="student-name">Priyanshu Kumar </h2>
                    <p class="college"><strong>Government Leather Institute Agra</strong>
                    </p>

                </div>
                <hr width="400px">
                <div class="details">
                    <p><strong>Course:</strong> Computer Science & Engineering</p>
                    <p> <strong>Birthday:</strong>10/03/2009</p>
                </div>
                <div class="id-line"><span class="id-label">
                        ID-No:</span>
                    <span class="id-value"> 641297</span>
                </div>
                <div class="barcode">
                    <!-- barcode -->
                </div>
                <footer class="card-footer">
                    <p class="footer-text">
                        <strong> Issued-By: </strong> Principle GLI
                    </p>
                </footer>
            </main>
        </div>
    </div>
</body>

</html>
